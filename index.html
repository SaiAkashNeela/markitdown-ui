<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unified Document to Markdown & RAG Converter</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #6b6b6b;
    --accent: #5c6bc0;
    --accent-hover: #7986cb;
    --success: #4caf50;
    --error: #ef5350;
    --radius: 8px;
    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .badge {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 0;
    overflow: hidden;
  }

  .panel-left {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow-y: auto;
  }

  .panel-right {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--surface);
  }

  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: #1e1f2b;
  }

  .dropzone input { display: none; }
  .dropzone-icon { font-size: 24px; margin-bottom: 8px; }
  .dropzone-text { font-size: 13px; color: var(--text); }
  .dropzone-subtext { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .file-info {
    display: none;
    margin-top: 10px;
    padding: 8px 12px;
    background: #222;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--accent-hover);
    word-break: break-all;
  }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  select, input[type="text"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--accent);
  }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .tabs-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    background: var(--surface);
  }

  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    padding: 14px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .output-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    background: var(--bg);
  }

  .render-markdown { line-height: 1.6; }
  .render-markdown h1, .render-markdown h2, .render-markdown h3 { margin-top: 1.2em; margin-bottom: 0.6em; }
  .render-markdown table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  .render-markdown th, .render-markdown td { border: 1px solid var(--border); padding: 8px 12px; }

  pre.code-out {
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
    color: #a9b7c6;
  }
</style>
</head>
<body>

<header>
  <h1>Document Converter Suite</h1>
  <span class="badge">Docling | MarkItDown | Google DocAI</span>
</header>

<main>
  <div class="panel-left">
    <div class="section">
      <div class="section-label">1. Conversion Engine</div>
      <div class="field">
        <label for="engineSelect">Select Engine</label>
        <select id="engineSelect" onchange="toggleEngineOptions()">
          <option value="google_docai">Google Document AI (AST & RAG Engine)</option>
          <option value="markitdown">Microsoft MarkItDown</option>
          <option value="docling">IBM Docling</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-label">2. Input Document</div>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <div class="dropzone-icon">📄</div>
        <div class="dropzone-text">Click or drag & drop document</div>
        <div class="dropzone-subtext">PDF, DOCX, XLSX, PPTX, JSON</div>
        <input type="file" id="fileInput" onchange="handleFileSelect(event)">
      </div>
      <div class="file-info" id="fileInfo"></div>
    </div>

    <div class="section">
      <button class="btn" id="convertBtn" onclick="startConversion()">Convert Document</button>
    </div>
  </div>

  <div class="panel-right">
    <div class="tabs-bar">
      <button class="tab-btn active" id="tabRender" onclick="switchTab('render')">Markdown Render</button>
      <button class="tab-btn" id="tabChunks" onclick="switchTab('chunks')">RAG Chunks (JSON)</button>
      <button class="tab-btn" id="tabRaw" onclick="switchTab('raw')">Raw Output</button>
    </div>

    <div class="output-area" id="outputArea">
      <div id="renderView" class="render-markdown"><p style="color:var(--muted)">Converted document Markdown will appear here...</p></div>
      <div id="chunksView" style="display:none;"><pre class="code-out" id="chunksCode">// RAG Chunk JSON objects will appear here...</pre></div>
      <div id="rawView" style="display:none;"><pre class="code-out" id="rawCode">// Raw payload will appear here...</pre></div>
    </div>
  </div>
</main>

<script>
  let selectedFile = null;
  let activeTab = 'render';

  function handleFileSelect(e) {
    const files = e.target.files;
    if (files.length > 0) {
      selectedFile = files[0];
      document.getElementById('fileInfo').innerText = selectedFile.name + " (" + (selectedFile.size / 1024).toFixed(1) + " KB)";
      document.getElementById('fileInfo').style.display = 'block';
    }
  }

  function toggleEngineOptions() {}

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('renderView').style.display = tab === 'render' ? 'block' : 'none';
    document.getElementById('chunksView').style.display = tab === 'chunks' ? 'block' : 'none';
    document.getElementById('rawView').style.display = tab === 'raw' ? 'block' : 'none';

    if (tab === 'render') document.getElementById('tabRender').classList.add('active');
    if (tab === 'chunks') document.getElementById('tabChunks').classList.add('active');
    if (tab === 'raw') document.getElementById('tabRaw').classList.add('active');
  }

  async function startConversion() {
    if (!selectedFile) {
      alert("Please select a file to convert.");
      return;
    }

    const engine = document.getElementById('engineSelect').value;
    const btn = document.getElementById('convertBtn');
    btn.disabled = true;
    btn.innerText = "Converting...";

    const formData = new FormData();
    formData.append("file", selectedFile);

    let apiUrl = "";
    if (engine === "google_docai") apiUrl = "/google-docai-api/v1/convert/file";
    else if (engine === "markitdown") apiUrl = "/markitdown-api/v1/convert/file";
    else if (engine === "docling") apiUrl = "/docling-api/v1/convert/file";

    try {
      // Direct JSON upload test for Google Document AI if JSON file
      if (engine === "google_docai" && selectedFile.name.endsWith(".json")) {
        apiUrl = "/google-docai-api/v1/convert/json";
        const jsonText = await selectedFile.text();
        const jsonPayload = JSON.parse(jsonText);
        const resp = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(jsonPayload)
        });
        const data = await resp.json();
        handleResponse(data);
      } else {
        const resp = await fetch(apiUrl, { method: "POST", body: formData });
        const data = await resp.json();
        handleResponse(data);
      }
    } catch (err) {
      alert("Conversion Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Convert Document";
    }
  }

  function handleResponse(data) {
    const md = data.markdown || data.text_content || str(data);
    document.getElementById('renderView').innerHTML = marked.parse(md);
    document.getElementById('chunksView').querySelector('pre').innerText = JSON.stringify(data.chunks || [], null, 2);
    document.getElementById('rawView').querySelector('pre').innerText = JSON.stringify(data, null, 2);
  }
</script>

</body>
</html>
