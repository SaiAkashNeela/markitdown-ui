server {
    listen 8080;
    client_max_body_size 100m;

    location /docling-api/ {
        proxy_pass https://docling-api-69030765595.us-central1.run.app/;
        proxy_set_header Host docling-api-69030765595.us-central1.run.app;
        proxy_ssl_server_name on;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    location /api/ {
        proxy_pass https://docling-api-69030765595.us-central1.run.app/;
        proxy_set_header Host docling-api-69030765595.us-central1.run.app;
        proxy_ssl_server_name on;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
