services:
  docling:
    image: quay.io/docling-project/docling-serve:latest
    ports:
      - "8002:5001"
    environment:
      - DOCLING_SERVE_MAX_NUM_PAGES=10000
      - DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT=600
    restart: unless-stopped

  ui:
    build: .
    ports:
      - "8003:80"
    depends_on:
      - docling
    restart: unless-stopped
